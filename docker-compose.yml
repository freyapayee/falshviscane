services:
  db:
    image: postgres:16
    container_name: viscane_postgres
    environment:
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-viscane_db}
    ports:
      - "${LOCAL_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "${APP_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      VISCANE_SECRET_KEY: ${VISCANE_SECRET_KEY:-change-this-key}
      DATABASE_URL: ${DATABASE_URL:-postgresql://user:password@db:5432/viscane_db}

volumes:
  postgres_data:
