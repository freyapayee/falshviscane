plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def farmerBaseUrl = providers.gradleProperty("farmerBaseUrl").getOrElse("").trim()
if (farmerBaseUrl) {
    def server = new URI(farmerBaseUrl)
    if (server.scheme != "https" || !server.host || server.userInfo || server.query || server.fragment || !(server.path in ["", "/"])) {
        throw new GradleException("farmerBaseUrl must be an HTTPS origin, for example https://farmers.example.org/")
    }
}

android {
    namespace "com.viscane.app"
    compileSdk 36
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId "com.viscane.app"
        minSdk 24
        targetSdk 36
        buildConfigField "String", "FARMER_BASE_URL", '"' + farmerBaseUrl + '"'
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            manifestPlaceholders = [allowCleartext: "true"]
        }
        release {
            manifestPlaceholders = [allowCleartext: "false"]
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

tasks.configureEach {
    if (name == "preReleaseBuild") {
        doFirst {
            if (!farmerBaseUrl) throw new GradleException("Release requires -PfarmerBaseUrl=https://YOUR-FARMER-HOST/")
        }
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "androidx.activity:activity-ktx:1.10.1"
    testImplementation "junit:junit:4.13.2"
}

